[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brightness-dimmer"
version = "0.1.0"
description = "Monitor brightness dimmer controlled by a Yoctopuce ambient light sensor."
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "yoctopuce>=2.1.13347",
]
dynamic = []

[tool.setuptools]
packages = { find = {} }

[project.optional-dependencies]
packaging = ["pyinstaller>=5.0"]

[project.scripts]
brightness-dimmer = "autobright:main"
